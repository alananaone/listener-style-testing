<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 96" fill="none" aria-label="Listenfy 雙圓交疊傾聽標誌">
  <!-- 1. 左圓（澄藍底） -->
  <circle cx="48" cy="48" r="36" fill="#dce3f6" stroke="#262f6b" stroke-width="3.8" />

  <!-- 2. 兩圓交集底色（疊合微暖透光色） -->
  <path d="M60 14.1A36 36 0 0 1 60 81.9A36 36 0 0 1 60 14.1Z" fill="#ebded0" />

  <!-- 3. 左圓右弧穿入形成的半透明陰影弧 -->
  <path d="M60 14.1A36 36 0 0 1 60 81.9" stroke="#9a8c82" stroke-width="3.8" stroke-linecap="round" fill="none" opacity="0.65" />

  <!-- 4. 右圓（柔暖黃底）與完整深藍描邊 -->
  <path d="M60 14.1A36 36 0 0 1 60 81.9A36 36 0 1 0 60 14.1Z" fill="#feebc1" />
  <circle cx="72" cy="48" r="36" fill="none" stroke="#262f6b" stroke-width="3.8" />

  <!-- 5. 中心垂直杏仁核（珊瑚暖橘） -->
  <path d="M60 26.5C64.5 37 64.5 59 60 69.5C55.5 59 55.5 37 60 26.5Z" fill="#ff7d59" stroke="#262f6b" stroke-width="3.4" stroke-linejoin="round" />
</svg>